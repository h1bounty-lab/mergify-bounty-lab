queue_rules:
  - name: default
    merge_conditions:
      - "#approved-reviews-by >= 1"
pull_request_rules:
  - name: ping
    conditions:
      - label = ping
    actions:
      comment:
        message: ack
  - name: refresh
    conditions:
      - label = refresh
    actions:
      update: {}
  - name: refresh-victim2
    conditions:
      - head = lab/victim2
    actions:
      update: {}
  - name: squash-victim3
    conditions:
      - head = lab/victim3
    actions:
      squash: {}

# reload
  - name: refresh-victim4
    conditions:
      - head = lab/victim4
    actions:
      update: {}
  - name: comment-victim4
    conditions:
      - head = lab/victim4
    actions:
      comment:
        message: probe-comment
